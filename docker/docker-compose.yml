services:
  db:
    image: postgres:16-alpine
    container_name: budgeting-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgeting_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - budgeting_db_data_fresh:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgeting_app"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  budgeting_db_data_fresh:
