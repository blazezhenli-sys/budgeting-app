services:
  db:
    image: postgres:16-alpine
    container_name: tehran-budget-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: budgeting_app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432"
    volumes:
      - tehran_budget_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d budgeting_app"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tehran-budget-app
    profiles: ["prod"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/budgeting_app?schema=public
      NODE_ENV: production
      RUN_DB_SEED_ON_STARTUP: "true"
    ports:
      - "3000:3000"
    command: sh ./scripts/startup.sh
    networks:
      - network

  app-dev:
    image: node:22-alpine
    container_name: tehran-budget-app-dev
    profiles: ["dev"]
    working_dir: /app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/budgeting_app?schema=public
      NODE_ENV: development
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
      RUN_DB_SEED_ON_STARTUP: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - tehran_budget_node_modules:/app/node_modules
    command: sh -c "rm -rf .next && npm install && npm run db:push && npm run db:seed && npm run dev -- --hostname 0.0.0.0 --port 3000"
    networks:
      - network

volumes:
  tehran_budget_db_data:
  tehran_budget_node_modules:

networks:
  network:
    driver: bridge
